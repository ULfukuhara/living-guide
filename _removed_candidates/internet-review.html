<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>インターネット 本文案｜Casaネッビア</title><link rel="stylesheet" href="/v4/style.css"><style>body{padding:24px 16px}main{max-width:760px;margin:0 auto}.draft-note{padding:16px;background:#fff4dc;border-radius:12px;margin:16px 0}h1{font-size:28px}</style></head>
<body><main id="main"><a href="/v4/?propertyNo=11300#section/internet">← 現在のインターネットの案内</a><h1>インターネット</h1><p class="draft-note">Casaネッビア専用の本文案です。公開表示は変更していません。シートの51〜64行に下書きを登録しています。</p></main>
<script type="module">
import {normalizeBlocks} from '/v4/content.js?v=internet-draft-1';
import {renderBody} from '/v4/body.js?v=internet-draft-1';
const response=await fetch('./internet-sheet-rows.json');
if(!response.ok)throw new Error('本文案を読み込めませんでした');
const rows=await response.json();
const blocks=normalizeBlocks(rows.map(row=>({id:row.block_id,data:{...row,enabled:true}})));
document.querySelector('#main').append(renderBody({label:'インターネット',blocks,hidePanelTitle:true}));
</script></body></html>
